name: Send Daily Biochemistry Flashcards

on:
  schedule:
    # هر روز ساعت 09:00 به وقت تهران (05:30 UTC)
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions

permissions:
  contents: write   # برای commit کردن فایل flashcard_state.json

jobs:
  send-flashcards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-telegram-bot

      - name: Send today's flashcards
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python send_daily_flashcards.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flashcard_state.json
          git diff --staged --quiet || git commit -m "Update flashcard state"
          git push
