name: Snell Anatomy Bot

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت
  workflow_dispatch:

jobs:
  send-highlight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Snell bot
        env:
          SNELL_BOT_TOKEN: ${{ secrets.SNELL_BOT_TOKEN }}
          SNELL_CHANNEL_ID: ${{ secrets.SNELL_CHANNEL_ID }}
        run: python snell_bot.py
